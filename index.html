<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lord of the Flies Clash</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one arcade cabinet screen, pixel canvas scaled to fit, a strip of key hints underneath. */
:root{
  --bg:#08070f; --cab:#14112a; --edge:#2c2650; --fg:#ece8ff; --muted:#8f88b8; --p1:#ff4a4a; --p2:#3a9aff;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;box-sizing:border-box;
  font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
#game{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;border:3px solid var(--edge);box-shadow:0 0 0 3px var(--cab),0 0 40px rgba(90,60,200,.35);max-width:100%}
.keys{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;color:var(--muted);text-align:center}
.keys b{color:var(--fg);font-weight:600}
.keys .a{color:var(--p1)} .keys .b{color:var(--p2)}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
#game{touch-action:none}
/* touch controls: stick + 5 attack buttons per player, sized to the shorter screen side */
#touch{--b:clamp(46px,8.5vmin,72px);--stick:clamp(104px,20vmin,160px);width:100%;max-width:1280px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;padding-bottom:env(safe-area-inset-bottom,0px)}
#touch button{font:700 calc(var(--b)*.36)/1 ui-monospace,Menlo,monospace;color:#fff;border:3px solid #0b0914;border-radius:10px;cursor:pointer;touch-action:none;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.25),0 3px 0 #0b0914;-webkit-tap-highlight-color:transparent}
#touch button.on{transform:translateY(3px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.2);filter:brightness(1.3)}
.pad{display:flex;align-items:center;gap:16px}
#touch.solo .pad{display:contents}
#touch.solo .stick{order:0}#touch.solo .mid{order:1}#touch.solo .btns{order:2}
#touch.duo .pad{order:0}#touch.duo .mid{order:1}#touch.duo #pad2{order:2}
.stick{position:relative;flex:none;width:var(--stick);height:var(--stick);border-radius:50%;background:radial-gradient(circle,#231d44 0 45%,#171230 46%);border:3px solid var(--edge);box-shadow:0 0 0 3px var(--cab);touch-action:none}
.stick::before{content:"";position:absolute;inset:10%;border-radius:50%;background:
  linear-gradient(#5a50a0,#5a50a0) 50% 0/14% 10% no-repeat,linear-gradient(#5a50a0,#5a50a0) 50% 100%/14% 10% no-repeat,
  linear-gradient(#5a50a0,#5a50a0) 0 50%/10% 14% no-repeat,linear-gradient(#5a50a0,#5a50a0) 100% 50%/10% 14% no-repeat}
.nub{position:absolute;left:30%;top:30%;width:40%;height:40%;border-radius:50%;background:#3a3270;border:3px solid #8a80d0;box-shadow:inset 0 -4px 0 rgba(0,0,0,.35);pointer-events:none}
.btns{display:grid;grid-template-columns:repeat(6,calc(var(--b)/2));grid-auto-rows:var(--b);gap:8px}
.btns button{grid-column:span 2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.btns button.big{grid-column:span 3}
.btns b{font-size:1em}.btns i{font-style:normal;font-size:.5em;letter-spacing:.06em;opacity:.9}
.sig{background:#7a4ad0}.spc{background:#2a7ad8}.sup{background:#8a7a20}.lit{background:#5a5a78}.hvy{background:#c8302a}.thr{background:#2a8a5a}
.btns button.locked{filter:grayscale(1) brightness(.55)}
.sup.ready{background:#f2c21a;color:#1a1200!important;animation:glow .5s steps(2) infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px #fff6a0,0 0 18px #ffe84a}}
.mid{display:flex;flex-direction:column;gap:8px;align-items:center}
.sys{background:#2c2650;font-size:calc(var(--b)*.3)!important;min-width:calc(var(--b)*1.1);height:calc(var(--b)*.75)}
.menu{display:flex;gap:16px;justify-content:center;width:100%}
.menu button{background:#c8302a;font-size:clamp(16px,3.4vmin,28px)!important;padding:.7em 1.4em}
.menu button+button{background:#2a7ad8}.menu button+button+button{background:#3a9a4a}
@media (prefers-reduced-motion:reduce){.sup.ready{animation:none}}
#screen{position:relative;container-type:inline-size;max-width:100%;flex:none}
#screen #game{display:block}
/* character select bio: sits in the middle of the select screen, between the two fighters */
#bio{position:absolute;left:26%;right:26%;top:35%;bottom:2.5%;overflow:auto;background:rgba(11,9,20,.82);border:2px solid var(--edge);border-radius:6px;
  padding:.6em .8em;font:500 clamp(9px,1.5cqw,15px)/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--fg);display:flex;flex-direction:column;gap:.5em;-webkit-user-select:text;user-select:text}
#bio .bh{display:flex;align-items:baseline;gap:.6em;flex-wrap:wrap}
#bio .who{font-weight:700;font-size:.8em;padding:.05em .4em;border-radius:3px;background:var(--p1);color:#fff}
#bio[data-side="1"] .who{background:var(--p2)}
#bio h2{margin:0;font-size:1.35em;letter-spacing:.08em;color:#ffe84a}
#bio .tag{color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-size:.85em}
#bio p{margin:0;max-width:60ch}
#bio ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.35em}
#bio li{display:grid;grid-template-columns:3.2em 1fr;gap:0 .5em;align-items:baseline}
#bio li b{color:#fff}#bio li.isup b{color:#ffe84a}
#bio li span{grid-column:2;color:#b8b2d8;font-size:.92em}
#bio kbd{font:inherit;font-weight:700;text-align:center;border:1px solid var(--edge);border-radius:3px;background:#1a1536;color:#fff;padding:0 .3em}
#bio .basic{color:var(--muted);font-size:.9em}
@media (max-width:560px){#bio{left:2%;right:2%;top:58%;bottom:2%}}
/* phones held sideways: controls float over the game so the screen can use the full height */
@media (orientation:landscape) and (max-height:520px){
  body{padding-block:0}
  #touch{position:fixed;inset:0;max-width:none;z-index:5;pointer-events:none;align-items:flex-end;--b:42px;--stick:112px;
    padding:8px max(14px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));box-sizing:border-box}
  #touch .stick,#touch button{pointer-events:auto}
  #touch .stick{opacity:.7}
  #touch .btns button{opacity:.75}
  #touch .mid{flex-direction:row;align-self:flex-end}
  #touch .menu{align-self:flex-end;padding-bottom:4px}
  #touch.duo{--b:34px;--stick:92px}
  .btns{gap:6px}
}
/* phones held upright: a tighter layout under the game, pause and mute on their own row */
@media (orientation:portrait) and (max-width:520px){
  #touch{--b:50px;--stick:120px;flex-wrap:wrap;gap:10px}
  #touch.solo .mid{order:-1;flex-basis:100%;flex-direction:row;justify-content:center}
  #touch.duo .mid{flex-basis:100%;flex-direction:row;justify-content:center}
  #touch.duo .pad{flex-basis:100%;justify-content:space-between}
  .btns{gap:6px}
  .menu{flex-wrap:wrap;gap:10px}
}
</style>
</head>
<body>
<div id="screen">
<canvas id="game" width="320" height="180" tabindex="0" aria-label="Lord of the Flies Clash fighting game"></canvas>
<div id="bio" hidden aria-live="polite"></div>
</div>
<div class="keys">
  <span><span class="a">P1</span> <b>WASD</b> move/jump · <b>1 2 3 4 5</b> attacks</span>
  <span><span class="b">P2</span> <b>Arrows</b> · <b>6 7 8 9 0</b> (or Numpad 1-5)</span>
  <span><b>1</b>/<b>6</b> signature · <b>2</b>/<b>7</b> special · <b>3</b>/<b>8</b> super · <b>4</b>/<b>9</b> light · <b>5</b>/<b>0</b> heavy · <b>4+5</b>/<b>9+0</b> throw</span>
  <span>Hold <b>back</b> to block · <b>P</b> pause · <b>M</b> mute</span>
</div>
<div id="touch" hidden>
  <div class="pad" id="pad1">
    <div class="stick" data-p="1" aria-label="P1 move stick"><span class="nub"></span></div>
    <div class="btns"><button type="button" class="sig" data-code="Digit1" aria-label="P1 SIG"><b>1</b><i>SIG</i></button><button type="button" class="spc" data-code="Digit2" aria-label="P1 SPC"><b>2</b><i>SPC</i></button><button type="button" class="sup" data-code="Digit3" aria-label="P1 SUP"><b>3</b><i>SUP</i></button><button type="button" class="lit" data-code="Digit4" aria-label="P1 LIGHT"><b>4</b><i>LIGHT</i></button><button type="button" class="hvy" data-code="Digit5" aria-label="P1 HEAVY"><b>5</b><i>HEAVY</i></button><button type="button" class="thr" data-code="Digit4 Digit5" aria-label="P1 THROW"><b>4+5</b><i>THROW</i></button></div>
  </div>
  <div class="mid" id="tmid">
    <button type="button" class="sys" data-code="Escape" aria-label="Pause or back">II</button>
    <button type="button" class="sys" data-code="KeyQ" id="tquit" hidden>QUIT</button>
    <button type="button" class="sys" data-code="KeyM" aria-label="Mute">&#9835;</button>
  </div>
  <div class="pad" id="pad2">
    <div class="stick" data-p="2" aria-label="P2 move stick"><span class="nub"></span></div>
    <div class="btns"><button type="button" class="sig" data-code="Digit6" aria-label="P2 SIG"><b>6</b><i>SIG</i></button><button type="button" class="spc" data-code="Digit7" aria-label="P2 SPC"><b>7</b><i>SPC</i></button><button type="button" class="sup" data-code="Digit8" aria-label="P2 SUP"><b>8</b><i>SUP</i></button><button type="button" class="lit" data-code="Digit9" aria-label="P2 LIGHT"><b>9</b><i>LIGHT</i></button><button type="button" class="hvy" data-code="Digit0" aria-label="P2 HEAVY"><b>0</b><i>HEAVY</i></button><button type="button" class="thr" data-code="Digit9 Digit0" aria-label="P2 THROW"><b>9+0</b><i>THROW</i></button></div>
  </div>
  <div class="menu" id="tmenu">
    <button type="button" data-code="Digit1">VS CPU</button>
    <button type="button" data-code="Digit2">2 PLAYERS</button>
  </div>
</div>
<script>
(()=>{
const W=320,H=180,GROUND=160,GRAV=0.35;
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
let touchUI=false;
const phoneSideways=()=>matchMedia('(orientation: landscape) and (max-height: 520px)').matches;
function fit(){const res=touchUI?(phoneSideways()?-10:innerHeight>innerWidth?innerHeight*.42:Math.min(240,Math.max(130,innerHeight*.3))):70;const s=Math.min((innerWidth-32)/W,(innerHeight-res-16)/H);const k=!touchUI&&s>=2?Math.floor(s):Math.max(.5,s);cv.style.width=W*k+'px';cv.style.height=H*k+'px';const sc=document.getElementById('screen');if(sc)sc.style.width=(W*k+6)+'px';}
addEventListener('resize',fit);fit();

/* ---------- 3x5 pixel font ---------- */
const GL={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111',
'0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110','4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001110',
'.':'000000000000010',',':'000000000010100','!':'010010010000010','?':'110001010000010','-':'000000111000000',':':'000010000010000','/':'001001010100100','+':'000010111010000','(':'001010010010001',')':'100010010010100',"'":'010010000000000','>':'100010001010100','<':'001010100010001','*':'000101010101000','=':'000111000111000','&':'010101010101011','#':'101111101111101'};
function drawT(s,x,y,c,k){ctx.fillStyle=c;for(let i=0;i<s.length;i++){const g=GL[s[i]];if(!g)continue;for(let p=0;p<15;p++)if(g[p]==='1')ctx.fillRect(x+i*4*k+(p%3)*k,y+((p/3)|0)*k,k,k);}}
function text(s,x,y,c='#fff',k=1,al='left',sh='#000'){s=String(s).toUpperCase();const w=s.length*4*k-k;x=Math.round(al==='center'?x-w/2:al==='right'?x-w:x);y=Math.round(y);if(sh)drawT(s,x+k,y+k,sh,k);drawT(s,x,y,c,k);}

/* ---------- sprite primitives ---------- */
let SX=0,SY=0,SF=1,ST=null,SD=false;
function R(dx,dy,w,h,c){ctx.fillStyle=ST||(SD?dk(c):c);ctx.fillRect(SF>0?SX+dx:SX-dx-w,SY+dy,w,h);}
function pc(cx,cy,r,c){ctx.fillStyle=c;cx=Math.round(cx);cy=Math.round(cy);r=Math.max(0,Math.round(r));for(let dy=-r;dy<=r;dy++){const w=Math.round(Math.sqrt(r*r-dy*dy));ctx.fillRect(cx-w,cy+dy,w*2+1,1);}}
function alpha(a,fn){const o=ctx.globalAlpha;ctx.globalAlpha=o*a;fn();ctx.globalAlpha=o;}

/* ---------- roster ---------- */
const SK='#f2c69a';
// Move order in each list: light, heavy, special (key 2), signature (key 1), super (key 3).
const ROSTER=[
{id:'ralph',name:'Ralph',from:'The Chief',body:'human',color:'#e0b83a',quote:"Keep the fire going. That's how we get rescued.",
 bio:"The original leader of the group, fair-haired and sensible. He wants to be rescued and puts logic and thinking first, like keeping the signal fire lit and building the huts.",
 look:{skin:SK,hair:'#f4d76a',hairHi:'#fff2b0',style:'ralph',top:'#cfcab4',tear:1,arm:SK,hand:SK,belt:'#6a5a3a',pants:'#4a5a7a',shorts:1,boot:'#c8956a'},
 stats:{hp:110,pow:1.1,def:1.05,spd:1.2,jump:1.1},
 moves:[
 {name:'Punch',type:'melee',dmg:5,st:4,ac:4,rc:8,range:18,kb:2,pose:'punch',info:'A quick jab.'},
 {name:'Kick',type:'melee',dmg:9,st:8,ac:5,rc:14,range:18,hy:-26,kb:4,pose:'kick',info:'A slower, harder kick.'},
 {name:'Logic Attack',type:'proj',dmg:10,st:12,ac:1,rc:16,speed:4,size:5,kind:'idea',color:'#ffe66a',pose:'cast',info:'Throws a bright idea across the beach.'},
 {name:'Leader Attack',type:'dash',dmg:12,st:10,ac:14,rc:16,dash:6,range:16,kb:6,lift:4,aura:'#ffe08a',pose:'dash',info:'Charges forward and leads with his shoulder.'},
 {name:'Conch Blow',type:'beam',super:1,dmg:36,st:34,ac:40,rc:24,len:290,thick:24,color:'#f6e6c8',core:'#ffffff',sound:1,pose:'cast',info:'Blows the conch. Sound waves roll across the whole beach.'}]},
{id:'jack',name:'Jack',from:'The Hunter',body:'human',color:'#c8302a',quote:'The hunters win. Bring the meat!',
 bio:"Turns savage and leaves the group to start his own tribe of hunters. He leads the choir to hunt pigs and holds feasts day and night. He can sing a C-sharp.",
 look:{skin:'#f0c098',hair:'#d0462a',hairHi:'#ff7a4a',style:'jack',paint:1,top:'#1a1a20',arm:'#1a1a20',hand:'#f0c098',belt:'#c8a040',pants:'#1a1a20',shorts:1,boot:'#c08a62',cape:'#101014',weapon:'spear'},
 stats:{hp:105,pow:1.3,def:0.95,spd:1.3,jump:1.1},
 moves:[
 {name:'Punch',type:'melee',dmg:5,st:4,ac:4,rc:8,range:18,kb:2,pose:'punch',info:'A quick jab.'},
 {name:'Kick',type:'melee',dmg:9,st:8,ac:5,rc:14,range:18,hy:-26,kb:4,pose:'kick',info:'A slower, harder kick.'},
 {name:'Pig Hunt',type:'proj',dmg:12,st:12,ac:1,rc:18,speed:4.5,size:6,kind:'pig',color:'#f0a0a8',hy:-6,pose:'cast',info:'Drives a charging pig along the ground. Jump over it.'},
 {name:'Spear Poke',type:'melee',dmg:11,st:8,ac:5,rc:16,range:44,kb:5,pose:'punch',spear:1,info:'A long-reach jab with his sharpened spear.'},
 {name:'Kill the Beast',type:'multi',super:1,dmg:36,st:28,ac:36,rc:22,every:12,range:44,kb:1.5,pose:'punch',spear:1,aura:'#d8302a',shouts:['KILL THE BEAST!','CUT HIS THROAT!','SPILL HIS BLOOD!'],info:'Three-hit chant combo: kill the beast, cut his throat, spill his blood.'}]},
{id:'piggy',name:'Piggy',from:'The Thinker',body:'human',color:'#3a8ad8',quote:'See? Thinking beats shouting.',
 bio:"Considered the smartest of the group and very focused, he remembers what is important. Asthma and a weak body mean nobody takes him seriously. They miss him when he is gone.",
 look:{skin:'#f4cca8',hair:'#8a6a40',style:'piggy',glasses:1,top:'#7a9ab8',belly:1,arm:'#7a9ab8',hand:'#f4cca8',belt:'#5a4a38',pants:'#6a5a48',shorts:1,boot:'#5a4030'},
 stats:{hp:85,pow:1.25,def:0.8,spd:0.85,jump:0.85},
 moves:[
 {name:'Slap',type:'melee',dmg:4,st:4,ac:4,rc:9,range:16,kb:2,pose:'punch',info:'A weak slap. Piggy is not a fighter.'},
 {name:'Clumsy Kick',type:'melee',dmg:8,st:9,ac:5,rc:16,range:16,hy:-26,kb:4,pose:'kick',info:'A slow kick that still stings.'},
 {name:'Asthma Attack',type:'multi',dmg:14,st:8,ac:30,rc:18,every:6,range:30,hy:-42,hh:30,kb:.6,pose:'cast',puff:1,info:'A wheezing cloud that hurts anyone standing close.'},
 {name:'Brain Wave',type:'proj',dmg:11,st:12,ac:1,rc:16,speed:3.5,size:6,kind:'wave',color:'#ff8ad8',pose:'cast',info:'A wobbling wave of pure thinking.'},
 {name:'Spec Fire',type:'sky',super:1,dmg:38,st:28,ac:1,rc:28,warn:34,width:20,count:1,color:'#ff9a2a',fire:1,pose:'cast',info:'Focuses the sun through his glasses and lights a fire under the enemy.'}]},
{id:'simon',name:'Simon',from:'The Listener',body:'human',color:'#5aa04a',quote:'I only listened. You did the rest.',
 bio:"The quietest of the group, he listens and observes. He is the first to die, killed because the boys think he is the beast. He stands for spirituality and fairness.",
 look:{skin:'#dcae80',hair:'#151515',hairHi:'#3a3a48',style:'simon',top:'#4e5e3e',arm:'#dcae80',hand:'#dcae80',belt:'#2c2c30',pants:'#34343c',shorts:1,boot:'#b88a5e'},
 stats:{hp:100,pow:1.0,def:1.0,spd:1.4,jump:1.25},
 moves:[
 {name:'Palm Strike',type:'melee',dmg:5,st:4,ac:4,rc:8,range:18,kb:2,pose:'punch',info:'A quick open-hand strike.'},
 {name:'Kick',type:'melee',dmg:9,st:8,ac:5,rc:14,range:18,hy:-26,kb:4,pose:'kick',info:'A slower, harder kick.'},
 {name:'Fly Barrage',type:'proj',dmg:12,st:12,ac:1,rc:16,speed:2.5,size:7,kind:'flies',phits:4,color:'#22262c',pose:'cast',info:'A buzzing swarm of flies that hits four times.'},
 {name:'Fairness Strike',type:'melee',dmg:10,st:6,ac:5,rc:14,range:22,kb:5,fair:1,handOrb:'#fff2b0',pose:'punch',info:'Hits 50% harder when Simon has less health than his opponent.'},
 {name:'Listener Attack',type:'aoe',super:1,dmg:34,st:30,ac:1,rc:30,count:6,height:60,color:'#fff2b0',light:1,pose:'cast',info:'Simon goes still and listens, then pillars of light rise all around him.'}]},
];
for(const c of ROSTER){
  c.name=c.name.toUpperCase();c.from=c.from.toUpperCase();
  if(c.body==='human'){c.w=16;c.h=46;c.handY=-31;c.portY=54;}
  for(const m of c.moves){m.name=m.name.toUpperCase();if(m.hy==null&&m.type!=='melee'&&m.type!=='multi')m.hy=c.handY;}
}

/* ---------- character drawing ---------- */
const SHADE={};
function hex6(c){return c.length===4?'#'+c[1]+c[1]+c[2]+c[2]+c[3]+c[3]:c;}
function mix(c,k,t){const key=c+k+t;if(SHADE[key])return SHADE[key];const n=parseInt(hex6(c).slice(1),16);const f=v=>Math.max(0,Math.min(255,Math.round(v+(t-v)*k))).toString(16).padStart(2,'0');return SHADE[key]='#'+f(n>>16)+f(n>>8&255)+f(n&255);}
const dk=c=>mix(c,.3,0),lt=c=>mix(c,.35,255);
const isWeaponPose=p=>p==='slash';
function legStand(L,dx,back){
  if(back)SD=true;

  }else{

    s.life--;const t=other(s.owner);

    if(!e.owner.groupHit&&e.life>8&&ov({x:e.x-e.w/2,y:GROUND-e.h,w:e.w,h:e.h},hurtBox(t))){e.owner.groupHit=true;hit(e.owner,t,e.dmg,{kb:4,lift:7,src:e.owner.x,sup:e.sup,col:'#ffd23a',use:e.use});}

/* ---------- CPU ---------- */
function reach(f,m){switch(m.type){case 'melee':case 'multi':return f.w/2+m.range;case 'dash':return m.dash*m.ac*.7+m.range;case 'uppercut':return m.range+12;case 'beam':return m.len;case 'aoe':return 140;default:return 999;}}
// CPU levels: how fast it reacts, how often it blocks, attacks, combos, throws and punishes.
const CPU_LEVELS=[
 {name:'EASY',col:'#7ee08a',desc:'SLOW TO REACT AND RARELY BLOCKS',block:.15,react:22,near:.07,far:.012,cd:[50,90],combo:0,thr:0,brk:0,sup:.006,punish:0,aa:0},
 {name:'MEDIUM',col:'#ffe84a',desc:'A FAIR FIGHT',block:.45,react:12,near:.16,far:.025,cd:[26,56],combo:.15,thr:.008,brk:.04,sup:.02,punish:.1,aa:.1},
 {name:'HARD',col:'#ff9a4a',desc:'BLOCKS OFTEN, COMBOS AND THROWS',block:.72,react:6,near:.26,far:.04,cd:[14,38],combo:.55,thr:.025,brk:.1,sup:.04,punish:.4,aa:.35},
 {name:'SUPER HARD',col:'#ff4a4a',desc:'NEAR-PERFECT DEFENSE, PUNISHES EVERY MISTAKE',block:.92,react:2,near:.36,far:.06,cd:[6,22],combo:.9,thr:.05,brk:.25,sup:.08,punish:.85,aa:.7},
];
function aiInput(me,o){
  const inp={left:false,right:false,up:false,down:false,atk:[false,false,false,false,false]};
  if(G.phase!=='play'||o.state==='ko')return inp;
  const L=CPU_LEVELS[G.cpuLevel]||CPU_LEVELS[1],R=Math.random,ms=me.ch.moves;
  const A=me.ai||(me.ai={cd:40,think:0,move:0,blockFor:0,jump:false,seen:0});
  const d=Math.abs(o.x-me.x),to=o.x>me.x?1:-1;
  const set=dir=>{if(dir>0)inp.right=true;else if(dir<0)inp.left=true;};
  const press=i=>{inp.atk[i]=true;};
  if(A.cd>0)A.cd--;
  if(me.state==='thrown'){if(R()<L.brk)inp.atk[0]=inp.atk[1]=true;return inp;}
  // cancel a landed light or heavy into a special
  if(me.state==='attack'&&me.hitConnected&&me.mi>=0&&me.mi<=1&&!A.comboTried){
    A.comboTried=true;
    if(R()<L.combo){const opts=[2,3].filter(i=>reach(me,ms[i])>=d&&!isMoveLocked(me,i));if(me.meter>=100&&R()<.5)opts.push(4);if(opts.length){press(opts[R()*opts.length|0]);return inp;}}
  }
  if(me.state!=='attack')A.comboTried=false;
  const incoming=(o.state==='attack'&&o.move&&o.move.type!=='throw'&&o.mt<o.move.st+o.move.ac&&d<reach(o,o.move)+12)||projectiles.some(p=>p.owner===o&&Math.abs(p.x-me.x)<80&&Math.sign(me.x-p.x)===Math.sign(p.vx))||strikes.some(s=>s.owner===o);
  A.seen=incoming?A.seen+1:0;
  if(incoming&&A.seen>=L.react&&me.state!=='attack'&&A.blockFor===0){A.blockFor=R()<L.block?20:-14;if(A.blockFor<0&&R()<.3&&me.onGround)inp.up=true;}
  if(A.blockFor>0){A.blockFor--;set(-to);return inp;}
  if(A.blockFor<0)A.blockFor++;
  // punish an opponent stuck in recovery
  const oRecover=o.state==='attack'&&o.move&&o.mt>=o.move.st+o.move.ac;
  if(oRecover&&d<40&&me.state!=='attack'&&!A.punished){A.punished=true;if(R()<L.punish){press(d<28?0:1);A.cd=10;return inp;}}
  if(o.state!=='attack')A.punished=false;
  // anti-air a jump-in
  if(!o.onGround&&o.state==='jump'&&d<40&&me.onGround&&me.state!=='attack'&&!A.aaTried){
    A.aaTried=true;if(R()<L.aa){const up=ms.findIndex(m=>m.type==='uppercut');press(up>=0&&up<4?up:1);A.cd=12;return inp;}
  }
  if(o.onGround)A.aaTried=false;
  // throw an opponent who is standing still or blocking
  if(d<=(me.w+o.w)/2+6&&me.onGround&&me.state!=='attack'&&o.onGround&&(o.guard||o.state==='idle'||o.state==='walk')&&R()<L.thr){inp.atk[0]=inp.atk[1]=true;A.cd=L.cd[0];return inp;}
  if(me.meter>=100&&A.cd===0&&R()<L.sup&&d<reach(me,ms[4])){press(4);A.cd=60;return inp;}
  if(A.cd===0&&me.state!=='attack'){
    const opts=[];
    for(let i=0;i<4;i++){if(isMoveLocked(me,i))continue;if(reach(me,ms[i])>=d){opts.push(i);if(i<2&&d<40)opts.push(i,i);}}
    if(opts.length&&R()<(d<45?L.near:L.far)){press(opts[R()*opts.length|0]);A.cd=L.cd[0]+(R()*(L.cd[1]-L.cd[0])|0);return inp;}
  }
  if(--A.think<=0){A.think=10+(R()*20|0);A.move=d>36?(R()<.85?1:0):(R()<.3?-1:R()<.5?0:1);A.jump=R()<.07;}
  set(A.move*to);if(A.jump){inp.up=true;A.jump=false;}
  return inp;
}

/* ---------- screens: logic ---------- */
function startMatch(){
  G.f=[makeFighter(ROSTER[G.sel.c[0]],0),makeFighter(ROSTER[G.sel.c[1]],1)];
  G.wins=[0,0];G.round=1;G.winner=-1;G.stage=STAGES[Math.random()*STAGES.length|0];
  G.screen='fight';startRound();
}
function startRound(){
  G.f.forEach(resetFighter);projectiles=[];strikes=[];erupts=[];parts=[];superFreeze=null;hitstop=0;slowmo=0;
  G.phase='intro';G.phaseT=0;G.timer=99;G.paused=false;
}
function stepTitle(){
  if(pressed.Digit1||pressed.Numpad1||pressed.Enter||pressed.Space||pressed.KeyF){G.mode='cpu';G.screen='diff';G.diffSel=G.cpuLevel;sfx('confirm');}
  else if(pressed.Digit2||pressed.Numpad2){G.mode='2p';toSelect();}
}
function stepDiff(){
  const maps=[MAP.p1,MAP.p2];
  if(pressed.Escape){G.screen='title';return;}
  if(navP(maps,'up')||navP(maps,'left')){G.diffSel=(G.diffSel+3)%4;sfx('select');}
  if(navP(maps,'down')||navP(maps,'right')){G.diffSel=(G.diffSel+1)%4;sfx('select');}
  if(okP(maps)){G.cpuLevel=G.diffSel;toSelect();}
}
function toSelect(){G.screen='select';G.sel={c:[...G.last],done:[false,false],go:0,focus:0};sfx('confirm');}
function stepSelect(){
  const S=G.sel;
  if(pressed.Escape){if(S.done[1]&&!S.go)S.done[1]=false;else if(S.done[0]&&!S.go){S.done[0]=false;S.focus=0;}else G.screen='title';return;}
  if(S.go){if(--S.go===0){G.last=[...S.c];G.screen='vs';G.vsT=0;}return;}
  const ctrl=G.mode==='cpu'?[[MAP.p1,MAP.p2],[MAP.p1,MAP.p2]]:[[MAP.p1],[MAP.p2]];
  for(let i=0;i<2;i++){
    if(S.done[i])continue;
    if(G.mode==='cpu'&&i===1&&!S.done[0])continue;
    const m=ctrl[i];let c=S.c[i];
    const N=ROSTER.length;if(navP(m,'left'))c=(c+N-1)%N;if(navP(m,'right'))c=(c+1)%N;
    if(c!==S.c[i]){S.c[i]=c;S.focus=i;sfx('select');}
    if(okP(m)){S.done[i]=true;S.focus=G.mode==='cpu'?1:i;sfx(ROSTER[c].id==='jack'?'csharp':'confirm');if(G.mode==='cpu')break;}
  }

}
function stepVs(){G.vsT++;if(G.vsT>130||(G.vsT>20&&(okP([MAP.p1,MAP.p2]))))startMatch();}
function stepFight(){
  if(pressed.KeyP||pressed.Escape){if(G.phase!=='over'){G.paused=!G.paused;return;}}
  if(G.paused){if(pressed.KeyQ){G.paused=false;G.screen='select';G.sel={c:[...G.last],done:[false,false],go:0};}return;}
  if(superFreeze){if(--superFreeze.t<=0)superFreeze=null;return;}
  if(hitstop>0){hitstop--;return;}
  if(slowmo>0){slowmo--;if(slowmo%2)return;}
  G.phaseT++;
  const [a,b]=G.f;
  if(G.phase==='intro'&&G.phaseT>=100){G.phase='play';G.phaseT=0;}
  const live=G.phase==='play';
  const ia=!live?EMPTY:readInput(G.mode==='cpu'?[MAP.p1,MAP.p2]:[MAP.p1]);
  const ib=!live?EMPTY:G.mode==='cpu'?aiInput(b,a):readInput([MAP.p2]);
  updateFighter(a,b,ia);updateFighter(b,a,ib);pushApart(a,b);
  updateProjectiles();
  if(shake>0)shake*=.85;if(shake<.3)shake=0;if(whiteFlash>0)whiteFlash--;
  if(live&&G.phaseT%60===0&&G.timer>0){G.timer--;if(G.timer===0){G.phase='ko';G.phaseT=0;G.timeOver=true;}}
  if(G.phase==='ko'){
    if(G.phaseT===1){
      const pa=a.hp/a.maxHp,pb=b.hp/b.maxHp;
      G.roundWinner=(a.hp<=0&&b.hp<=0)||(pa===pb)?-1:pa>pb?0:1;
      if(G.roundWinner>=0)G.wins[G.roundWinner]++;
    }
    if(G.phaseT>60&&G.roundWinner>=0){const w=G.f[G.roundWinner];if(w.onGround&&w.state!=='attack'&&w.state!=='hurt'){w.state='win';w.vx=0;}}
    if(G.phaseT>170){

      if(G.wins[0]>=2||G.wins[1]>=2||G.round>=5){G.winner=G.wins[0]===G.wins[1]?-1:G.wins[0]>G.wins[1]?0:1;G.screen='result';G.resT=0;}
      else{G.round++;startRound();}
    }
  }
}
function stepResult(){
  G.resT++;
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.life--;}parts=parts.filter(p=>p.life>0);
  if(G.resT>30){if(pressed.Enter||pressed.Digit1||pressed.Digit6||pressed.Numpad1||pressed.Space){G.screen='vs';G.vsT=0;}else if(pressed.Escape){G.screen='select';G.sel={c:[...G.last],done:[false,false],go:0};}}

function step(){
  G.t++;

  if(G.screen==='title')stepTitle();else if(G.screen==='diff')stepDiff();else if(G.screen==='select')stepSelect();else if(G.screen==='vs')stepVs();

/* ---------- rendering ---------- */
function poseOf(f){
  const P={pose:'idle',b:0,step:0,t:f.t,flash:f.flash>0,ext:0,active:false};
  switch(f.state){
  case 'idle':P.b=(f.t>>4)%2;if(f.guard)P.pose='block';break;
  case 'walk':P.pose='walk';P.step=(f.t>>3)%2;break;
  case 'jump':P.pose='jump';break;
  case 'hurt':P.pose='hurt';break;
  case 'block':P.pose='block';break;
  case 'ko':P.pose='ko';P.lying=f.onGround||f.vy>0;break;
  case 'throwing':P.pose='punch';P.ext=5;P.active=true;break;
  case 'thrown':P.pose='hurt';P.flash=f.t%8<2;break;
  case 'win':P.pose='win';P.b=(f.t>>3)%2;break;
  case 'attack':{const m=f.move,mt=f.mt;
    if(mt<m.st)P.pose=m.pose==='cast'?'cast':'windup';
    else if(mt<m.st+m.ac+6){P.pose=m.pose||'cast';P.active=mt<m.st+m.ac;P.ext=m.ext||0;if(m.gatling&&P.active)P.ext=6+((mt*7)%Math.max(4,m.ext-6));}

}
function handPos(f){return{x:f.x+f.facing*(f.w/2+8),y:f.y+f.ch.handY};}

function drawBeam(f,m,prog){

  drawSprite(a,Math.round(-40+120*k),130,1,{pose:'idle',t:G.vsT,b:0},{scale:2});
  drawSprite(b,Math.round(W+40-120*k),130,-1,{pose:'idle',t:G.vsT,b:0},{scale:2});
  text(a.name,80,140,'#ffffff',2,'center');text(a.from,80,152,'#ffd8d8',1,'center');
  text(b.name,240,140,'#ffffff',2,'center');text(b.from,240,152,'#d8e8ff',1,'center');
  if(G.vsT>15)text('VS',160,60,G.t%8<4?'#ffe84a':'#ff4a4a',6,'center');
}
function drawResult(){
  drawStage(G.stage,G.t);alpha(.6,()=>{ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);});
  if(G.winner<0){text('DRAW GAME',160,60,'#ffffff',4,'center');}
  else{
    const ch=G.f[G.winner].ch;
    alpha(.4,()=>pc(160,100,40,ch.color));
    drawSprite(ch,160,140,1,{pose:'win',t:G.t,b:(G.t>>3)%2},{scale:2});
    text(ch.name+' WINS!',160,8,'#ffe84a',3,'center');
    const who=G.mode==='cpu'?(G.winner===0?'YOU WIN':'CPU WINS'):(G.winner===0?'PLAYER 1':'PLAYER 2');
    text(who,160,28,G.winner===0?'#ff8a8a':'#8ac0ff',1,'center');
    const q=ch.quote.toUpperCase();text('"'+q+'"',160,148,'#ffffff',1,'center');
  }
  if(G.resT>30&&G.t%40<28)text(touchUI?'1: REMATCH    II: CHARACTER SELECT':'ENTER: REMATCH    ESC: CHARACTER SELECT',160,166,'#c8c0f0',1,'center');
}
const bioEl=document.getElementById('bio');let bioKey='';
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function syncBio(){
  const on=G.screen==='select';bioEl.hidden=!on;if(!on){bioKey='';return;}
  const S=G.sel,i=S.focus||0,ch=ROSTER[S.c[i]],k=ch.id+i+G.mode+touchUI;if(k===bioKey)return;bioKey=k;
  const keysL=keyLabels(i),key=n=>keysL?esc(keysL[n]):'–',cap=t=>t.charAt(0)+t.slice(1).toLowerCase();
  const row=n=>{const m=ch.moves[n];return '<li class="'+(m.super?'isup':'')+'"><kbd>'+key(n)+'</kbd><b>'+esc(m.name.split(' ').map(cap).join(' '))+(m.super?' (super)':'')+'</b><span>'+esc(m.info)+'</span></li>';};
  bioEl.dataset.side=i;
  bioEl.innerHTML='<div class="bh"><span class="who">'+esc(plabel(i))+'</span><h2>'+esc(ch.name)+'</h2><span class="tag">'+esc(ch.from)+'</span></div>'+
    '<p>'+esc(ch.bio)+'</p><ul>'+row(3)+row(2)+row(4)+'</ul>'+
    '<p class="basic"><kbd>'+key(0)+'</kbd> '+esc(cap(ch.moves[0].name))+' &nbsp; <kbd>'+key(1)+'</kbd> '+esc(ch.moves[1].name.split(' ').map(cap).join(' '))+' &nbsp; <kbd>'+(keysL?esc(keysL[0]+'+'+keysL[1]):'–')+'</kbd> Throw</p>';
}
function render(){
  syncBio();
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;
  if(G.screen==='title')drawTitle();else if(G.screen==='diff')drawDiff();else if(G.screen==='select')drawSelect();else if(G.screen==='vs')drawVs();else if(G.screen==='fight')drawFightScreen();else if(G.screen==='result')drawResult();
  if(muted)text('MUTED',316,2,'#8f88b8',1,'right');
}

let last=performance.now(),acc=0;const DT=1000/60;
function loop(ts){
  acc+=Math.min(100,ts-last);last=ts;
  while(acc>=DT){step();acc-=DT;for(const k in pressed)delete pressed[k];}
  render();syncTouch();requestAnimationFrame(loop);
}
/* ---------- touch controls ---------- */
const touchEl=document.getElementById('touch'),pads=[document.getElementById('pad1'),document.getElementById('pad2')],
  tmid=document.getElementById('tmid'),tmenu=document.getElementById('tmenu'),tquit=document.getElementById('tquit'),
  supBtns=[...touchEl.querySelectorAll('.sup')],
  padBtns=pads.map(p=>[...p.querySelectorAll('.btns button')]),PAD_MOVE=[3,2,4,0,1];
function enableTouch(){if(touchUI)return;touchUI=true;touchEl.hidden=false;document.querySelector('.keys').hidden=true;tKey='';fit();}
function unlockAudio(){initAudio();if(AC&&AC.state==='suspended')AC.resume();}
function vPress(c){if(!keys[c])pressed[c]=true;keys[c]=true;}
function vRelease(c){keys[c]=false;}
touchEl.querySelectorAll('button[data-code]').forEach(b=>{
  const codes=b.dataset.code.split(' ');let id=null;
  b.addEventListener('pointerdown',e=>{e.preventDefault();unlockAudio();id=e.pointerId;try{b.setPointerCapture(id);}catch(_){}b.classList.add('on');codes.forEach(vPress);});
  const up=e=>{if(id===null||e.pointerId!==id)return;id=null;b.classList.remove('on');codes.forEach(vRelease);};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
touchEl.querySelectorAll('.stick').forEach(st=>{
  const map=st.dataset.p==='1'?{l:'KeyA',r:'KeyD',u:'KeyW',d:'KeyS'}:{l:'ArrowLeft',r:'ArrowRight',u:'ArrowUp',d:'ArrowDown'};
  const nub=st.querySelector('.nub');let id=null;
  const set=d=>{for(const k of['l','r','u','d']){if(d[k])vPress(map[k]);else vRelease(map[k]);}};
  const move=e=>{const r=st.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
    const m=r.width*.32,len=Math.hypot(dx,dy);if(len>m){dx*=m/len;dy*=m/len;}
    nub.style.transform=`translate(${dx}px,${dy}px)`;const t=r.width*.1;
    set({l:dx<-t,r:dx>t,u:dy<-t*1.8,d:dy>t*1.8});};
  st.addEventListener('pointerdown',e=>{e.preventDefault();unlockAudio();id=e.pointerId;try{st.setPointerCapture(id);}catch(_){}move(e);});
  st.addEventListener('pointermove',e=>{if(e.pointerId===id)move(e);});
  const end=e=>{if(e.pointerId!==id)return;id=null;nub.style.transform='';set({});};
  st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);st.addEventListener('lostpointercapture',end);
});
let tKey='';
function syncTouch(){
  if(!touchUI)return;
  const k=G.screen+'|'+G.mode+'|'+G.paused;
  if(k!==tKey){tKey=k;const title=G.screen==='title',duo=!title&&G.mode==='2p'&&G.screen!=='diff';
    tmenu.hidden=!title;tmid.hidden=title;pads[0].hidden=title;pads[1].hidden=!duo;
    touchEl.classList.toggle('solo',!title&&!duo);touchEl.classList.toggle('duo',duo);
    tquit.hidden=!(G.screen==='fight'&&G.paused);}
  const fight=G.screen==='fight';
  for(let p=0;p<2;p++){
    const f=!fight?null:G.f[p];
    supBtns[p].classList.toggle('ready',!!f&&f.meter>=100);
    padBtns[p].forEach((b,n)=>b.classList.toggle('locked',!!f&&isMoveLocked(f,PAD_MOVE[n])));
  }
}
if(navigator.maxTouchPoints>0||matchMedia('(pointer: coarse)').matches)enableTouch();
addEventListener('touchstart',enableTouch,{passive:true});
cv.focus();
requestAnimationFrame(loop);
})();
</script>
